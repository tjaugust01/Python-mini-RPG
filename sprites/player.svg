<svg id="player-svg" width="256" height="256" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <!-- 
                        DESIGN-LOGIK: 
                        Wir nutzen ein 64x64 Grid. 
                        Farben: 
                        Haut: #FFDBAC
                        Haare: #63472F
                        Shirt: #3B82F6 (Blau)
                        Hose: #334155 (Dunkelgrau)
                        Schuhe: #1E293B
                    -->

                    <!-- Haare -->
                    <rect x="24" y="12" width="16" height="4" fill="#63472F"></rect>
                    <rect x="22" y="14" width="20" height="8" fill="#63472F"></rect>
                    
                    <!-- Gesicht -->
                    <rect x="24" y="18" width="16" height="10" fill="#FFDBAC"></rect>
                    <!-- Augen -->
                    <rect x="28" y="22" width="2" height="2" fill="#000"></rect>
                    <rect x="34" y="22" width="2" height="2" fill="#000"></rect>
                    
                    <!-- Hals -->
                    <rect x="30" y="28" width="4" height="2" fill="#FFDBAC"></rect>

                    <!-- Oberkörper (Shirt) -->
                    <rect x="22" y="30" width="20" height="12" fill="#3B82F6"></rect>
                    <!-- Arme -->
                    <rect x="18" y="30" width="4" height="10" fill="#3B82F6"></rect>
                    <rect x="42" y="30" width="4" height="10" fill="#3B82F6"></rect>
                    <!-- Hände -->
                    <rect x="18" y="40" width="4" height="4" fill="#FFDBAC"></rect>
                    <rect x="42" y="40" width="4" height="4" fill="#FFDBAC"></rect>

                    <!-- Hose -->
                    <rect x="24" y="42" width="16" height="10" fill="#334155"></rect>
                    <rect x="24" y="52" width="7" height="4" fill="#334155"></rect>
                    <rect x="33" y="52" width="7" height="4" fill="#334155"></rect>

                    <!-- Schuhe -->
                    <rect x="22" y="56" width="9" height="4" fill="#1E293B"></rect>
                    <rect x="33" y="56" width="9" height="4" fill="#1E293B"></rect>
                </svg>